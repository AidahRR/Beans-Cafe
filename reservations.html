<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/Reservations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="hero-section">
        <div class="hero-content">
            <img class="logo" src="images/Cafe_Logo.png" alt="Cafe logo">
            <nav>
                <h2><a href="index.html">Home</a></h2>
                <h2><a href="reservations.html">Reservations</a></h2>
                <h2><a href="gallery.html">Gallery</a></h2>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <h1>Reserve a Table</h1>
            <form>
            <div class="Reservations-form">
                <div class="Form-1">
                    <div class="Forename-form">
                        <label for="forename"></label>
                        <input type="text" id="forename" required placeholder="First Name">
                    </div>
                    <div class="Surname-form">
                        <label for="surname"></label>
                        <input type="text" id="surname" required placeholder="Last Name">
                    </div>
                </div>
                <div class="Form-2">
                    <div class="Email-form">
                        <label for="email"></label>
                        <input type="email" id="email" required placeholder="Email Address">
                    </div>
                
                    <div class="Phone-form">
                        <label for="phone"></label>
                        <input type="tel" id="phone" required placeholder="Phone Number">
                    </div>
                </div>
                <div class="Form-3">
                    <div class="Date-form">
                        <label for="date"></label>
                        <input type="date" id="date" min="2026-08-13" required>
                    </div>
                    <div class="time-form">
                        <label for="reservation-time"></label>
                        <input type="time" id="reservation-time" min="08:00" max="21:00"required placeholder="Time">
                    </div>
                </div>
                <div class="occasion-form">
                    <div class="guests-form">
                        <label for="guests"></label>
                        <input type="number" id="guests" min="1" max="8" required placeholder="No. of Guests">
                    </div>
                    <div class="requests-form">
                        <label for="requests"></label>
                        <textarea id="requests" rows="4" cols="40" placeholder="Any special requests?"></textarea>
                        <button type="submit">Submit Reservation</button>
                    </div>
                </div>
            </div>
            </form>
        </section>
        <footer>
        <div class="legal-info">
            <h3>Legal Info:</h3>
            <p><a href="privacy.html">Privacy Policy</a></p>
            <p><a href="Copyright.html">Copyright info</a></p>
            <p><a href="TOU.html">Terms and Conditions</a></p>
        </div>
        <div class="contact-info">
            <h3>Contact Us:</h3>
            <p><a href="mailto:Aidahrahman96@gmail.com" target="_blank">
                <img src="images/Gmail-logo.png" alt="Email icon"> 
            </a></p>
            <p>Location: 123 Coffee Street, London, UK</p>
            <p>Phone: +44 123 456 7890</p>
        </div>
        <div class="hours-info">
            <h3>Opening Hours:</h3>
            <p>Mon-Fri: 8am - 9pm</p>
            <p>Saturday: 8am - 10pm</p>
            <p>Sunday: 8am - 5pm</p>
        </div>
        <div class="socials">
            <h3>Our Socials:</h3>
            <p><a href="https://www.facebook.com/" target="_blank">
                <img src="images/Facebook-logo.png" alt="Facebook logo"></a></p>
            <p><a href="https://www.instagram.com/" target="_blank">
                <img src="images/Instagram-logo.png" alt="Instagram logo"></a></p>
            <p><a href="https://twitter.com/" target="_blank">
                <img src="https://i.pinimg.com/1200x/f5/40/cd/f540cd15687e51228310e919f889754c.jpg" alt="Twitter logo"></a></p>
        </div>
    </footer>
</body>
</html>
